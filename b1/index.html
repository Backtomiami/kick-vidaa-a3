<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kick TV B1</title><link rel="stylesheet" href="style.css"><body>
<header><img src="kick-icon.png" alt="Kick"><b>KICK TV</b><span>Личная версия · B1</span></header>
<nav><button id="home">Главная</button><button id="search">Поиск</button><button id="favorites">Избранное</button><button id="categories">Категории</button></nav>
<main id="browse"><h1 id="heading">Ваши каналы</h1><p id="notice">Каталог эфиров пока не подключён. Выберите канал по имени.</p><section id="entry"><label>Имя канала <input id="query" maxlength="60" autocomplete="off" placeholder="Например, имя знакомого стримера"></label><button id="open">Открыть канал</button><button id="save">Добавить в избранное</button></section><div id="keyboard" aria-label="Экранная клавиатура"></div><section id="grid"></section></main>
<section id="playback" hidden><div class="toolbar"><button id="back">← Назад</button><h2 id="playing"></h2><button id="star">В избранное</button><span>Звук: VOL + / − на пульте ТВ</span></div><div id="stage"></div></section><p id="status" role="status"></p><script src="app.js"></script></body></html>
